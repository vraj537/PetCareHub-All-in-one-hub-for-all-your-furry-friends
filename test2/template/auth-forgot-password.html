{% load static %}

<head>
  <meta charset="UTF-8">
  <title>PetCareHub - All in one hub for all your furry friends</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" type="image/x-icon" href="{% static 'assets/img/petcarehub_roundlogo_bgremoved.png' %}">
  <!-- General CSS Files -->
  <link rel="stylesheet" href="{% static 'assets/css/app.min.css' %}">
  <!-- Template CSS -->
  <link rel="stylesheet" href="{% static 'assets/css/style.css' %}">
  <link rel="stylesheet" href="{% static 'assets/css/components.css' %}">
  <!-- Custom style CSS -->
  <style>
/* 1. Logo: Match scaling and padding exactly */
.card-auth {
    background: rgba(255, 255, 255, 0.9) !important; /* Halka transparent white */
    backdrop-filter: blur(10px); /* Glass effect */
    border-radius: 30px !important; /* Round corners like other pages */
    border: 4px solid var(--tg-brand-color) !important;
    box-shadow: 0 15px 35px rgba(137, 75, 141, 0.2) !important;
}
.card-header-auth {
    background: linear-gradient(45deg, #894B8D, #b36eb8) !important;
    color: white !important;
    border-radius: 25px 25px 0 0 !important;
    padding: 20px !important;
    text-align: center;
}



.login-brand {
    display: block !important; /* inline-block hata kar block karein */
    margin: 0 auto 30px auto !important; /* Isse card ke upar exact center hoga */
    
    padding: 0 !important; 
    border: 5px solid #b294b5 !important; 
    border-radius: 80px !important; /* Shape ko aur round kiya taaki borders square na lagein */
    
    /* - Width adjust ki taaki card ke borders se bahar na dikhe */
    width: 350px !important; 
    height: 110px !important;
    
    background: #fff;
    overflow: hidden; 
    box-shadow: 0 10px 25px rgba(137, 75, 141, 0.2) !important;
}

/* Header Gradient Fix (Same as screenshot) */
.card-header-auth {
    background: linear-gradient(180deg, #894B8D 0%, #7c3f81 100%) !important;
    padding: 25px !important;
    border-bottom: none !important;
    
}

/* 3. Header: Matching visual weight */
.card-header-auth {
    background: linear-gradient(180deg, #894B8D 0%, #7c3f81 100%) !important;
    padding: 25px !important;
    display: flex !important;
    justify-content: center !important;
    align-items: center !important;
}

.card-header-auth h4 {
    color: #ffffff !important;
    font-size: 16px !important; /* Adjusted for longer text */
    font-weight: 800 !important;
    text-transform: uppercase;
    letter-spacing: 1px;
}

/* 4. Button: Rounded corners matching Login */
.btn-auth-color {
    background: #814685 !important;
    color: white !important;
    border: none !important;
    border-radius: 18px !important; /* Perfect match */
    padding: 16px !important;
    font-weight: 700 !important;
    text-transform: uppercase;
    width: 100%;
    box-shadow: 0 6px 15px rgba(129, 70, 133, 0.3) !important;
}
</style>
  <!-- <link rel='shortcut icon' type='image/x-icon' href="{% static 'assets/img/favicon.ico' %}" /> -->
</head>

<body style="background-image: url('{% static 'assets/img/admin_background.png' %}'); background-size: cover; background-repeat: no-repeat; background-attachment: fixed; background-position: center;">
  <div class="loader"></div>
  <div id="app">
    <section class="section">
      <div class="container mt-5">
        <div class="row justify-content-center">
    <div class="col-12 col-sm-8 col-md-6 col-lg-5 col-xl-4">
            <div class="login-brand login-brand-color">
              <img alt="image" src="{% static 'assets/img/posts/logo2.png' %}" style="height:100px;width:320px;" />
              
            </div>
            <div class="card card-auth">
              <div class="card-header card-header-auth">
                <h4>Forgot Password</h4>
              </div>
              <!-- <center>
              <div class="logo-auth">
              	<img alt="image" src="{% static 'assets/img/logo.png' %}" />
          	  </div>
          	  <div>
          	  	<span class="logo-name-auth">Grexsan</span>
          	  </div>
          	  </center> -->
              <div class="card-body">
                <p class="text-muted">We will send a link to reset your password</p>
                <form method="POST" action="{% url 'forgotpass' %}">
                  {% csrf_token %}
                  <div class="form-group">
                    <label for="email">Email</label>
                    <input id="email" type="email" class="form-control" name="email" required autofocus>
                  </div>
                  <div class="form-group">
                    <button type="submit" class="btn btn-lg btn-block btn-auth-color">
                      Send OTP
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <!-- General JS Scripts -->
  <script src="{% static 'assets/js/app.min.js' %}"></script>
  <!-- JS Libraies -->
  <!-- Page Specific JS File -->
  <!-- Template JS File -->
  <script src="{% static 'assets/js/scripts.js' %}"></script>

</body>
