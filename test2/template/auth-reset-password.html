<head>
  <meta charset="UTF-8">
  <title>PetCareHub - All in one hub for all your furry friends</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" type="image/x-icon" href="{% static 'assets/img/petcarehub_roundlogo_bgremoved.png' %}">
  <!-- General CSS Files -->
  <link rel="stylesheet" href="{% static 'assets/css/app.min.css' %}">
  <!-- Template CSS -->
  <link rel="stylesheet" href="{% static 'assets/css/style.css' %}">
  <link rel="stylesheet" href="{% static 'assets/css/components.css' %}">
  <!-- Custom style CSS -->
<style>
/* 1. Logo: Match scaling and padding exactly */
.login-brand {
    display: inline-block;
    padding: 0 !important; 
    border: 5px solid #b294b5 !important; 
    border-radius: 70px !important; 
    width: 380px !important; 
    height: 110px !important;
    margin-bottom: 30px !important;
    background: #fff;
    overflow: hidden; 
    box-shadow: 0 10px 25px rgba(137, 75, 141, 0.2) !important;
}


.login-brand {
    display: block !important; /* inline-block hata kar block karein */
    margin: 0 auto 30px auto !important; /* Isse card ke upar exact center hoga */
    
    padding: 0 !important; 
    border: 5px solid #b294b5 !important; 
    border-radius: 80px !important; /* Shape ko aur round kiya taaki borders square na lagein */
    
    /* - Width adjust ki taaki card ke borders se bahar na dikhe */
    width: 350px !important; 
    height: 110px !important;
    
    background: #fff;
    overflow: hidden; 
    box-shadow: 0 10px 25px rgba(137, 75, 141, 0.2) !important;
}


/* 2. Card: Locking width to match Login */
.card-auth {
    background: rgba(255, 255, 255, 0.98) !important;
    border-radius: 35px !important; 
    border: none !important;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1) !important;
    overflow: hidden;
    /* Card width consistency */
    min-width: 100% !important; 
}

/* 3. Header: Matching visual weight */
.card-header-auth {
    background: linear-gradient(180deg, #894B8D 0%, #7c3f81 100%) !important;
    padding: 25px !important;
    display: flex !important;
    justify-content: center !important;
    align-items: center !important;
}

.card-header-auth h4 {
    color: #ffffff !important;
    font-size: 16px !important; /* Adjusted for longer text */
    font-weight: 800 !important;
    text-transform: uppercase;
    letter-spacing: 1px;
}

/* 4. Button: Rounded corners matching Login */
.btn-auth-color {
    background: #814685 !important;
    color: white !important;
    border: none !important;
    border-radius: 18px !important; /* Perfect match */
    padding: 16px !important;
    font-weight: 700 !important;
    text-transform: uppercase;
    width: 100%;
    box-shadow: 0 6px 15px rgba(129, 70, 133, 0.3) !important;
}
/* Password Strength Meter Styling */
.strength-meter {
    height: 5px;
    background-color: #eee;
    margin-top: 8px;
    border-radius: 5px;
    overflow: hidden;
    display: none; /* Default hidden */
}

.strength-meter-fill {
    height: 100%;
    width: 0%;
    transition: width 0.3s ease, background-color 0.3s ease;
}

/* Input blue tint matching login */
.form-control {
    background-color: #eef4ff !important;
    border: 1px solid #dce4f5 !important;
    border-radius: 12px !important;
}

.form-group label {
    font-weight: 700;
    color: #444;
}
</style>

<body style="background-image: url('{% static 'assets/img/admin_background.png' %}'); background-size: cover; background-repeat: no-repeat; background-attachment: fixed; background-position: center;">
  <div class="loader"></div>
  <div id="app">
    <section class="section">
      <div class="container mt-5">
        <div class="row justify-content-center">
    <div class="col-12 col-sm-8 col-md-6 col-lg-5 col-xl-4">
            <div class="login-brand login-brand-color">
              <img alt="image" src="{% static 'assets/img/posts/logo2.png' %}" style="height:100px;width:320px;" />
            </div>
            <div class="card card-auth">
              <div class="card-header card-header-auth">
                <h4>Reset Password</h4>
              </div>
              <div class="card-body">
                <p class="text-muted">Enter Your New Password</p>
                <form method="POST" action="{% url 'resetpass' %}">
                  {% csrf_token %}
                  <div class="form-group">
                    <label>OTP Code</label>
                    <input type="text" class="form-control" name="otp" placeholder="Enter 6-digit OTP" required>
                  </div>
                  <br>
                  <div class="form-group">
    <label for="password">New Password</label>
    <div class="input-group">
        <input id="password" type="password" class="form-control" name="password" 
               onkeyup="checkStrength(this.value)" required 
               style="border-radius: 12px 0 0 12px !important;">
        <div class="input-group-append">
            <span class="input-group-text" onclick="togglePass('password', this)" 
                  style="cursor: pointer; border-radius: 0 12px 12px 0; background: #f0f5ff; border: 2px solid #eee; border-left: none;">
                <i class="fas fa-eye"></i>
            </span>
        </div>
    </div>
    <br>
    <div class="strength-meter" id="meter-container">
        <div class="strength-meter-fill" id="meter-fill"></div>
    </div>
</div>

<div class="form-group">
    <label for="password-confirm">Confirm Password</label>
    <div class="input-group">
        <input id="password-confirm" type="password" class="form-control" name="confirm-password" required 
               style="border-radius: 12px 0 0 12px !important;">
        <div class="input-group-append">
            <span class="input-group-text" onclick="togglePass('password-confirm', this)" 
                  style="cursor: pointer; border-radius: 0 12px 12px 0; background: #f0f5ff; border: 2px solid #eee; border-left: none;">
                <i class="fas fa-eye"></i>
            </span>
        </div>
    </div>
</div>

                  <button type="submit" class="btn btn-auth-color btn-lg btn-block">Reset Admin Password</button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <!-- General JS Scripts -->
  <script src="{% static 'assets/js/app.min.js' %}"></script>
  <!-- JS Libraies -->
  <!-- Page Specific JS File -->
  <!-- Template JS File -->
  <script src="{% static 'assets/js/scripts.js' %}"></script>
  <script>
    /* - Universal Eye Toggle Logic */
function togglePass(fieldId, btn) {
    const input = document.getElementById(fieldId);
    const icon = btn.querySelector('i');
    
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash'); // Icon change
    } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
    }
}
/* - Password Strength Logic */
function checkStrength(password) {
    let strength = 0;
    const meter = document.getElementById('meter-container');
    const fill = document.getElementById('meter-fill');
    const text = document.getElementById('strength-text');

    // Show meter only when typing starts
    if (password.length > 0) {
        meter.style.display = 'block';
    } else {
        meter.style.display = 'none';
        text.innerHTML = '';
        return;
    }

    // Scoring Criteria
    if (password.length > 7) strength += 1;
    if (password.match(/[0-9]/)) strength += 1;
    if (password.match(/[A-Z]/)) strength += 1;
    if (password.match(/[^a-zA-Z0-9]/)) strength += 1;

    // UI Updates based on score
    switch (strength) {
        case 0:
        case 1:
            fill.style.width = '25%';
            fill.style.backgroundColor = '#ff4d4d'; // Red
            text.innerHTML = 'Weak 🐾';
            text.style.color = '#ff4d4d';
            break;
        case 2:
            fill.style.width = '50%';
            fill.style.backgroundColor = '#ffa500'; // Orange
            text.innerHTML = 'Medium...';
            text.style.color = '#ffa500';
            break;
        case 3:
            fill.style.width = '75%';
            fill.style.backgroundColor = '#2ecc71'; // Green
            text.innerHTML = 'Strong!';
            text.style.color = '#2ecc71';
            break;
        case 4:
            fill.style.width = '100%';
            fill.style.backgroundColor = '#27ae60'; // Dark Green
            text.innerHTML = 'Excellent! 🔒';
            text.style.color = '#27ae60';
            break;
    }
}
  </script>

</body>
