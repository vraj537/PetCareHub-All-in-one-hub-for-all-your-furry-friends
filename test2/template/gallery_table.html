{% extends 'header.html' %}
{% load static %}
{% block content %}
<!-- Main Content -->
<div class="main-content">
    <section class="section">
        <div class="section-header">
            <div class="row">
                <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12">
                    <div class="section-header-breadcrumb-content">
                    </div>
                </div>
            </div>
        </div>
        <div class="section-body">
            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h4>GALLERY TABLE</h4>
                            <a href="/insert_gallery_table/" class="btn btn-outline-success">ADD</a>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-striped table-hover" id="tableExport" style="width:100%;">
                                    <thead>
                                        <tr>
                                            <th>GALLERY_ID</th>
                                            <th>PROD_ID</th>
                                            <th>IMAGE_PATH</th>
                                            <th>EDIT</th>
                                            <th>REMOVE</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {% for item in items %}
                                        <tr>
                                            <td>{{ item.gallery_id }}</td>
                                            <td>{{ item.prod_id.prod_name }}</td>
                                            <td>
                                                {% if item.image_path %}
                                                <a href="/media/{{ item.image_path }}" target="_blank">
                                                    <img src="/media/{{ item.image_path }}" class="admin-table-img"
                                                        alt="Gallery Item">
                                                </a>
                                                {% else %}
                                                <span class="badge badge-light">No Image</span>
                                                {% endif %}
                                            </td>
                                            <td>
                                                <a href="/update_gallery_table/{{item.gallery_id}}" class="btn"
                                                    style="border: 1px solid #007bff; color: #007bff; background: transparent;">EDIT</a>
                                            </td>
                                            <td>
                                                <a href="/gallery_delete/{{item.gallery_id}}" class="btn"
                                                    style="border: 1px solid #dc3545; color: #dc3545; background: transparent;">REMOVE</a>
                                            </td>
                                        </tr>
                                        {% endfor %}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    {% endblock %}
