{% extends 'header.html' %}
{% load static %}
{% block content %}

<div class="main-content">
    <section class="section">
        <div class="section-header">
            <div class="row">
                <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12">
                    <div class="section-header-breadcrumb-content">
                        <h1>INSERT GALLERY DETAILS</h1>
                        <div class="section-header-breadcrumb">
                            <div class="breadcrumb-item active"><a href="#"><i class="fas fa-home"></i></a></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="section-body">
            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <form class="needs-validation" method="post" enctype="multipart/form-data" novalidate>
                            {% csrf_token %}
                            <div class="card-header">
                                <h4>INSERT GALLERY TABLE</h4>
                            </div>
                            <div class="card-body">
                                

                                <div class="section-title">Product ID</div>
                                <div class="form-group">
                                    <label>Select Product ID</label>
                                    <select class="form-control" name="prod_id" required>
                                        <option value="">-- Choose ID --</option>
                                        {% for data in products %}
                                        <option value="{{ data.prod_id }}">{{ data.prod_name }}</option>
                                        {% endfor %}
                                    </select>
                                </div>

                                <div class="form-group row">
                                    <label class="col-sm-3 col-form-label">image_path</label>
                                    <div class="col-sm-9">
                                        <input type="text" name="image_path" value="{{image_path}}"
                                            class="form-control" />
                                    </div>
                                </div>

                                <div class="card-footer text-right">
                                    <button class="btn btn-primary" type="submit">Submit</button>
                                </div>
                                
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
{% endblock %}
