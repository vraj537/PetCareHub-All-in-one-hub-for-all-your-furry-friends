{% extends 'header.html' %}
{% load static %}
{% block content %}

<div class="main-content">
    <section class="section">
        <div class="section-header">
            <div class="row">
                <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12">
                    <div class="section-header-breadcrumb-content">
                        <h1>INSERT PRODUCT TABLE DETAILS</h1>
                        <div class="section-header-breadcrumb">
                            <div class="breadcrumb-item active"><a href="#"><i class="fas fa-home"></i></a></div>
                        </div>
                    </div>
                </div>
                <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12">
                    <div class="section-header-breadcrumb-chart float-right">
                        <div class="breadcrumb-chart m-l-50">
                            <div class="float-right">
                                <div class="icon m-b-10">
                                    <div class="chart header-bar">
                                        <canvas width="49" height="40"></canvas>
                                    </div>
                                </div>
                            </div>
                            <div class="float-right m-r-5 m-l-10 m-t-1">
                                <div class="chart-info">
                                    <span>$10,415</span>
                                    <p>Last Week</p>
                                </div>
                            </div>
                        </div>

                        <div class="breadcrumb-chart m-l-50">
                            <div class="float-right">
                                <div class="icon m-b-10">
                                    <div class="chart header-bar2">
                                        <canvas width="49" height="40"></canvas>
                                    </div>
                                </div>
                            </div>
                            <div class="float-right m-r-5 m-l-10 m-t-1">
                                <div class="chart-info">
                                    <span>$22,128</span>
                                    <p>Last Month</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="section-body">
            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <form class="needs-validation" method="post" novalidate>
                            {% csrf_token %}
                            <div class="card-header">
                                <h4>INSERT PRODUCT TABLE</h4>
                            </div>
                            <div class="card-body">
                                <div class="section-title">Category ID</div>
                                <div class="form-group">
                                    <label>Select Category ID</label>
                                    <select class="form-control" name="category_id" required>
                                        <option value="">-- Choose ID --</option>
                                        {% for data in categories %}
                                        <option value="{{ data.category_id}}">{{ data.category_name }}</option>
                                        {% endfor %}
                                    </select>
                                </div>

                                <div class="section-title">Vendor ID</div>
                                <div class="form-group">
                                    <label>Select Vendor ID</label>
                                    <select class="form-control" name="vendor_id" required>
                                        <option value="">-- Choose ID --</option>
                                        {% for data in vendors %}
                                        <option value="{{ data.vendor_id }}">{{ data.vendor_name }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="form-group row">
                                    <label class="col-sm-3 col-form-label">prod_name</label>
                                    <div class="col-sm-9">
                                        <input type="text" name="prod_name" value="{{prod_name}}"
                                            class="form-control" />
                                    </div>
                                </div>

                                <div class="form-group row">
                                    <label class="col-sm-3 col-form-label">qty</label>
                                    <div class="col-sm-9">
                                        <input type="text" name="qty" value="{{qty}}" class="form-control" />
                                    </div>
                                </div>

                                <div class="form-group row">
                                    <label class="col-sm-3 col-form-label">description</label>
                                    <div class="col-sm-9">
                                        <input type="text" name="description" value="{{description}}"
                                            class="form-control" />
                                    </div>
                                </div>

                                <div class="form-group row">
                                    <label class="col-sm-3 col-form-label">price</label>
                                    <div class="col-sm-9">
                                        <input type="text" name="price" value="{{price}}" class="form-control" />
                                    </div>
                                </div>

                                <div class="form-group row">
                                    <label class="col-sm-3 col-form-label">cover_img_path</label>
                                    <div class="col-sm-9">
                                        <input type="text" name="cover_img_path" value="{{cover_img_path}}"
                                            class="form-control" />
                                    </div>
                                </div>
                            </div>
                            <div class="card-footer text-right">
                                <button class="btn btn-primary" type="submit">Submit</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
{% endblock %}
