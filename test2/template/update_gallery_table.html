{% extends 'header.html' %}
{% load static %}
{% block content %}

<!-- Main Content -->
<div class="main-content">
    <section class="section">
        <div class="section-header">
            <div class="row">
                <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12">
                    <div class="section-header-breadcrumb-content">
                        <h1>UPDATE GALLERY DETAILS</h1>
                        <div class="section-header-breadcrumb">
                            <div class="breadcrumb-item active"><a href="#"><i class="fas fa-home"></i></a></div>

                        </div>
                    </div>
                </div>
                <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12">
                    <div class="section-header-breadcrumb-chart float-right">
                        <div class="breadcrumb-chart m-l-50">
                            <div class="float-right">
                                <div class="icon m-b-10">
                                    <div class="chart header-bar">
                                        <canvas width="49" height="40"></canvas>
                                    </div>
                                </div>
                            </div>
                            <div class="float-right m-r-5 m-l-10 m-t-1">
                                <div class="chart-info">
                                    <span>$10,415</span>
                                    <p>Last Week</p>
                                </div>
                            </div>
                        </div>

                        <div class="breadcrumb-chart m-l-50">
                            <div class="float-right">
                                <div class="icon m-b-10">
                                    <div class="chart header-bar2">
                                        <canvas width="49" height="40"></canvas>
                                    </div>
                                </div>
                            </div>
                            <div class="float-right m-r-5 m-l-10 m-t-1">
                                <div class="chart-info">
                                    <span>$22,128</span>
                                    <p>Last Month</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="section-body">
            <div class="row">

                <div class="col-12">
                    <div class="card">
                        <form class="needs-validation" method="post"
                            action="{% url 'update_gallery_table' e.gallery_id %}" novalidate>
                            {% csrf_token %}
                            <div class="card-header">
                                <h4>UPDATE GALLERY TABLE</h4>
                            </div>
                            <div class="card-body">
                                {% if form.errors %}
                                <div class="alert alert-danger" style="color: red;">
                                    {{ form.errors }}
                                </div>
                                {% endif %}

                                <div class="form-group row">
                                    <label class="col-sm-3 col-form-label">gallery_id</label>
                                    <div class="col-sm-9">
                                        <input type="text" name="gallery_id" value="{{e.gallery_id}}" readonly
                                            class="form-control" required />
                                    </div>
                                </div>

                                <div class="form-group row">
                                    <label class="col-sm-3 col-form-label">prod_id</label>
                                    <div class="col-sm-9">
                                        <input type="text" name="prod_id" value="{{e.prod_id_id}}" class="form-control"
                                            readonly />
                                    </div>
                                </div>

                                <div class="form-group row">
                                    <label class="col-sm-3 col-form-label">image_path</label>
                                    <div class="col-sm-9">
                                        <input type="text" name="image_path" value="{{e.image_path}}"
                                            class="form-control" />
                                    </div>
                                </div>

                                <div class="card-footer text-right">
                                    <button class="btn btn-primary" type="submit">Submit</button>
                                </div>
                            </div>
                        </form>
                    </div>
                    {% endblock %}
