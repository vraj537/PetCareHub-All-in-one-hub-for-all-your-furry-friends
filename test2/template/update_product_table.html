{% extends 'header.html' %}
{% load static %}
{% block content %}

<div class="main-content">
    <section class="section">
        <div class="section-header">
            <div class="row">
                <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12">
                    <div class="section-header-breadcrumb-content">
                        <h1>UPDATE PRODUCT TABLE DETAILS</h1>
                        <div class="section-header-breadcrumb">
                            <div class="breadcrumb-item active"><a href="#"><i class="fas fa-home"></i></a></div>
                        </div>
                    </div>
                </div>
                <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12">
                    <div class="section-header-breadcrumb-chart float-right">
                        <div class="breadcrumb-chart m-l-50">
                            <div class="float-right">
                                <div class="icon m-b-10">
                                    <div class="chart header-bar">
                                        <canvas width="49" height="40"></canvas>
                                    </div>
                                </div>
                            </div>
                            <div class="float-right m-r-5 m-l-10 m-t-1">
                                <div class="chart-info">
                                    <span>$10,415</span>
                                    <p>Last Week</p>
                                </div>
                            </div>
                        </div>

                        <div class="breadcrumb-chart m-l-50">
                            <div class="float-right">
                                <div class="icon m-b-10">
                                    <div class="chart header-bar2">
                                        <canvas width="49" height="40"></canvas>
                                    </div>
                                </div>
                            </div>
                            <div class="float-right m-r-5 m-l-10 m-t-1">
                                <div class="chart-info">
                                    <span>$22,128</span>
                                    <p>Last Month</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="section-body">
            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <form class="needs-validation" method="post" action="{% url 'update_product_table' e.prod_id %}" novalidate>
                            {% csrf_token %}
                            <div class="card-header">
                                <h4>UPDATE PRODUCT TABLE</h4>
                            </div>
                            <div class="card-body">
                                <div class="form-group row">
                                    <label class="col-sm-3 col-form-label">prod_id</label>
                                    <div class="col-sm-9">
                                        <input type="text" name="prod_id" value="{{e.prod_id}}" readonly class="form-control" required />
                                    </div>
                                </div>

                                <div class="form-group row">
                                    <label class="col-sm-3 col-form-label">Category</label>
                                    <div class="col-sm-9">
                                        <input type="text" name="category_id" value="{{e.category_id_id}}" readonly class="form-control" />
                                    </div>
                                </div>

                                <div class="form-group row">
                                    <label class="col-sm-3 col-form-label">Vendor</label>
                                    <div class="col-sm-9">
                                        <input type="text" name="vendor_id" value="{{e.vendor_id_id}}" readonly class="form-control" />
                                    </div>
                                </div>

                                <div class="form-group row">
                                    <label class="col-sm-3 col-form-label">prod_name</label>
                                    <div class="col-sm-9">
                                        <input type="text" name="prod_name" value="{{e.prod_name}}" class="form-control" />
                                    </div>
                                </div>

                                <div class="form-group row">
                                    <label class="col-sm-3 col-form-label">qty</label>
                                    <div class="col-sm-9">
                                        <input type="text" name="qty" value="{{e.qty}}" class="form-control" />
                                    </div>
                                </div>

                                <div class="form-group row">
                                    <label class="col-sm-3 col-form-label">description</label>
                                    <div class="col-sm-9">
                                        <input type="text" name="description" value="{{e.description}}" class="form-control" />
                                    </div>
                                </div>

                                <div class="form-group row">
                                    <label class="col-sm-3 col-form-label">price</label>
                                    <div class="col-sm-9">
                                        <input type="text" name="price" value="{{e.price}}" class="form-control" />
                                    </div>
                                </div>

                                <div class="form-group row">
                                    <label class="col-sm-3 col-form-label">cover_img_path</label>
                                    <div class="col-sm-9">
                                        <input type="text" name="cover_img_path" value="{{e.cover_img_path}}" class="form-control" />
                                    </div>
                                </div>
                            </div> <div class="card-footer text-right">
                                <button class="btn btn-primary" type="submit">Submit</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
{% endblock %}
